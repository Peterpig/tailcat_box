[package]
name = "tailcat-box"
version = "0.1.0"
description = "Cross-platform desktop GUI for the official tailcat CLI"
authors = ["Tailcat Box contributors"]
edition = "2021"
# 1.82 is the floor for `Option::is_none_or`, which `task/mod.rs` uses.
# Tauri 2 itself only needs 1.77.2, so this is our own constraint.
rust-version = "1.82"
license = "MIT"
# 本项目尚未确定公开仓库地址，暂不声明 repository
default-run = "tailcat-box"

[lib]
name = "tailcat_box_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "sync",
    "time",
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
dirs = "6"
regex = "1"
once_cell = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Engine download (`engine_download.rs`). `rustls-tls` keeps TLS in pure Rust
# so the build never depends on the platform OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
sha2 = "0.10"
flate2 = "1.1"
tar = "0.4"
zip = { version = "5", default-features = false, features = ["deflate"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
